name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Em PR, um push novo cancela a execução anterior; na main, as execuções enfileiram.
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Valores falsos: o globalSetup do Jest sobrescreve DATABASE_URL com o Postgres do
    # testcontainers, mas o prisma.config.ts exige que a variável exista.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only
      JWT_EXPIRES_IN: 1h
      TRACKING_TOKEN_SECRET: ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0 # mesma versão do Dockerfile
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O test:cov não dispara o pretest, então o client é gerado aqui.
      - name: Gerar Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    name: Imagem Docker, scan e publicação
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # login OIDC na Azure
    outputs:
      published: ${{ steps.infra.outputs.exists == 'true' }}
      tag: ${{ steps.infra.outputs.tag }}
      api-image: ${{ steps.infra.outputs.api_image }}
      migration-image: ${{ steps.infra.outputs.migration_image }}
    env:
      IMAGE: garage-flow-api:${{ github.sha }}
      # Em PR só builda e escaneia. A credencial OIDC só aceita a main (ver infra/README.md).
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem de produção
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.IMAGE }}
          # Sem cache, como no antigo vulnerability-scan.yml: garante que o `apk upgrade` da
          # camada base rode a cada build e pegue as correções de segurança mais recentes.
          no-cache: true

      - name: Scan de vulnerabilidades
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Daqui para baixo só roda fora de PR, e só depois do scan passar.
      - name: Login na Azure (OIDC)
        if: env.PUBLISH == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        if: env.PUBLISH == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false # o wrapper polui a saída de `terraform output -raw`

      # Só lê o state remoto: não cria nem altera recurso nenhum. A infra é efêmera (ADR-13);
      # se ela não estiver de pé, as imagens não são publicadas e o deploy é pulado.
      - name: Ler outputs do Terraform
        id: infra
        if: env.PUBLISH == 'true'
        working-directory: infra/azure
        run: |
          terraform init -input=false -backend-config=backend.hcl
          if ! api_repo="$(terraform output -raw api_image_repository 2>/dev/null)" || [[ -z "$api_repo" ]]; then
            echo "::notice title=Infra não provisionada::Imagens não publicadas e deploy pulado. Rode o provision para subir o ambiente."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_SHA::7}"
          {
            echo "exists=true"
            echo "tag=$tag"
            echo "api_image=$api_repo:$tag"
            echo "migration_image=$(terraform output -raw migration_image_repository):$tag"
            echo "registry_login=$(terraform output -raw registry_login_command)"
          } >> "$GITHUB_OUTPUT"

      - name: Login no ACR
        if: steps.infra.outputs.exists == 'true'
        env:
          REGISTRY_LOGIN: ${{ steps.infra.outputs.registry_login }}
        run: eval "$REGISTRY_LOGIN"

      # Publica exatamente a imagem que passou pelo scan, sem rebuild.
      - name: Publicar imagem da API
        if: steps.infra.outputs.exists == 'true'
        env:
          API_IMAGE: ${{ steps.infra.outputs.api_image }}
        run: |
          docker tag "$IMAGE" "$API_IMAGE"
          docker push "$API_IMAGE"

      # Estágio `build` (tem o Prisma CLI), usado pelos Jobs de migration e bootstrap-admin.
      # Sem Trivy: tem dependências de desenvolvimento e nunca recebe tráfego.
      - name: Build e publicação da imagem dos Jobs
        if: steps.infra.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          push: true
          tags: ${{ steps.infra.outputs.migration_image }}

  deploy:
    name: Deploy (Azure)
    needs: image
    if: github.event_name != 'pull_request' && needs.image.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # TODO(tarefas 6 e 9): login Azure (OIDC) → kubeconfig → Job de migration →
      # Job de bootstrap-admin → overlay `cloud` → rollout status → curl /health.
      # Referência: infra/scripts/deploy-app.sh.
      - run: echo "deploy entra nas tarefas 6 e 9"

name: garage-flow-development

services:
  postgres:
    image: postgres:16
    container_name: garage-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garage-flow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d garage-flow']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: garage-flow-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP (a API envia por aqui)
      - '8025:8025' # interface web (caixa de entrada)

  api:
    build:
      context: .
      target: development
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
      - '9229:9229'
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT:-3000}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/garage-flow?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET}
      BUDGET_WEBHOOK_SECRET: ${BUDGET_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: '${SMTP_FROM:-Garage Flow <no-reply@garageflow.local>}'
    volumes:
      - .:/app
      - /app/node_modules
      # Testcontainers needs access to the host Docker daemon when tests run in this service.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      sh -c "rm -rf /app/dist /app/tsconfig.tsbuildinfo &&
      npx prisma generate &&
      npm run db:migrate:deploy &&
      npx prisma db seed &&
      npm run start:debug"

  sonar-db:
    image: postgres:16
    container_name: garage-flow-sonar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: garage-flow-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  postgres_data:
  sonar_postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

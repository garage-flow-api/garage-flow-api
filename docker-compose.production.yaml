name: garage-flow-production

services:
  postgres:
    image: postgres:16
    container_name: garage-flow-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: garage-flow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d garage-flow']
      interval: 5s
      timeout: 5s
      retries: 5

  # Init container: applies Prisma migrations and exits. The `production`
  # image has no Prisma CLI (kept out on purpose to avoid its transitive
  # vulnerabilities), so migrations run once from the `build` stage, which
  # still has full devDependencies.
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/garage-flow?schema=public
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Init container: inserts the demo users and catalog data after migrations.
  seed:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/garage-flow?schema=public
    command: npx prisma db seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      target: production
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/garage-flow?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET}
      BUDGET_WEBHOOK_SECRET: ${BUDGET_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:

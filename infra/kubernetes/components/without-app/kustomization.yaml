# Remove os recursos da API, mantendo apenas os Jobs.
# Usado pelos overlays que executam migration e bootstrap do administrador isoladamente.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: garage-flow-config
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: garage-flow-deployment
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: garage-flow-service
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: garage-flow-ingress
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: garage-flow-hpa

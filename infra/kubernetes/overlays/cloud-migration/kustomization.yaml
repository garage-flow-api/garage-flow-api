# Somente o Job `garage-flow-migration` (prisma migrate deploy) contra o banco gerenciado.
# Deve ser executado e concluído antes do bootstrap do administrador e do deploy da API.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../k8s

components:
  - ../../components/managed-database
  - ../../components/without-app

patches:
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: garage-flow-bootstrap-admin

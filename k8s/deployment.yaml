apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-flow-deployment
  labels:
    app: garage-flow
spec:
  selector:
    matchLabels:
      app: garage-flow
  template:
    metadata:
      labels:
        app: garage-flow
    spec:
      containers:
        - name: garage-flow-api
          image: garage-flow-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: NODE_ENV

            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: JWT_EXPIRES_IN

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: JWT_SECRET

            - name: TRACKING_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: TRACKING_TOKEN_SECRET
            - name: BUDGET_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: BUDGET_WEBHOOK_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: SMTP_PASS
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: PUBLIC_BASE_URL
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: garage-flow-config
                  key: SMTP_FROM

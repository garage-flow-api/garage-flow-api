apiVersion: batch/v1
kind: Job
metadata:
  name: garage-flow-migration

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: garage-flow-migration

    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true

      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: POSTGRES_DB

          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h garage-flow-postgres \
                -p 5432 \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB";
              do
                echo "Aguardando PostgreSQL..."
                sleep 2
              done

      containers:
        - name: migrate
          image: garage-flow-api-migration:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          command:
            - npx
            - prisma
            - migrate
            - deploy

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garage-flow-secrets
                  key: DATABASE_URL
